<style>
:root{color-scheme:light;--bg:#f2f2f7;--surface:#fff;--ink:#1c1c1e;--muted:#62626a;--accent:#0064d2;--tint:#eaf2ff;--line:#d1d1d6;--glass:rgba(255,255,255,.9);--warn:#a03900;--shadow:0 1px 3px #00000008,0 8px 24px #00000005;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,"PingFang TC","Microsoft JhengHei",sans-serif}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:1.0625rem;line-height:1.5;-webkit-font-smoothing:antialiased}button{min-height:44px;border:0;border-radius:999px;padding:.5rem 1rem;font-family:inherit;font-size:.9375rem;font-weight:600;line-height:1.4;color:var(--ink);background:var(--surface);cursor:pointer;transition:transform 150ms cubic-bezier(.25,.1,.25,1)}button:active{transform:scale(.96)}button:disabled{opacity:.35;cursor:default}button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:4px}h1,h2,p{margin:0}.session-bar{max-width:78rem;margin:auto;padding:max(.5rem,env(safe-area-inset-top)) 2rem .5rem;display:flex;align-items:center;justify-content:flex-end;gap:.75rem;min-height:64px}.total-timer{display:flex;align-items:baseline;gap:.75rem;font-variant-numeric:tabular-nums;white-space:nowrap}.total-label{font-size:.8125rem;color:var(--muted)}.total-value{font-size:1.375rem;font-weight:600;letter-spacing:-.02em}.total-goal{font-size:.8125rem;color:var(--muted)}.play{color:var(--accent);background:var(--tint);min-width:5rem}.reset{background:transparent;color:var(--muted)}.workspace{max-width:78rem;margin:0 auto;padding:.5rem 2rem max(7rem,calc(6rem + env(safe-area-inset-bottom)))}.paper{background:var(--surface);border-radius:20px;padding:2rem 3rem 2.5rem;box-shadow:var(--shadow);min-width:0}.title-row{display:flex;align-items:center;justify-content:space-between;gap:1.5rem}.heading{min-width:0;flex:1}.section{color:var(--accent);font-size:.8125rem;font-weight:600;letter-spacing:.04em;margin-bottom:.75rem}h1{font-size:clamp(1.75rem,2.8vw,2.6rem);line-height:1.35;letter-spacing:-.025em;overflow-wrap:break-word}.countdown{position:relative;flex:0 0 6.5rem;width:6.5rem;height:6.5rem;color:var(--accent)}.countdown svg{display:block;width:100%;height:100%;transform:rotate(-90deg)}.ring-track,.ring-fill{fill:none;stroke-width:5}.ring-track{stroke:var(--line);opacity:.65}.ring-fill{stroke:currentColor;stroke-dasharray:100 100;stroke-dashoffset:0;stroke-linecap:round;transition:stroke-dashoffset 200ms linear}.ring-content{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;pointer-events:none}.remaining{font-size:1.375rem;line-height:1.2;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.025em}.ring-label{color:var(--muted);font-size:.6875rem;line-height:1.3}.countdown.over{color:var(--warn)}.countdown.over .ring-track{stroke:var(--warn);opacity:.7}.countdown.over .ring-label{color:var(--warn)}.purpose{margin:1.25rem 0 2rem;color:var(--muted);line-height:1.75;font-size:1rem;max-width:60ch}.cue-list{list-style:none;margin:0;padding:0;display:grid;row-gap:1.25rem}.cue-list li{--cue-size:clamp(1.5rem,2.6vw,2rem);display:grid;grid-template-columns:2.5rem minmax(0,1fr);column-gap:1rem;align-items:baseline;font-size:var(--cue-size);line-height:1.65;font-weight:600}.cue-number{display:block;min-width:2.5rem;white-space:nowrap;word-break:normal;overflow-wrap:normal;text-align:left;color:var(--accent);font-size:1rem;line-height:1.65;font-weight:500;font-variant-numeric:tabular-nums}.cue-text{min-width:0;overflow-wrap:break-word;word-break:normal}.transition{margin-top:2rem;border-top:1px solid var(--line);padding-top:1.25rem;font-size:1.0625rem;line-height:1.8}.caption{display:block;color:var(--muted);font-size:.8125rem;margin-bottom:.5rem}.full-details{border-top:1px solid var(--line);margin-top:1.5rem;padding-top:1rem}.full-details summary{cursor:pointer;font-size:.9375rem;color:var(--muted);min-height:44px;padding:.5rem 0;width:fit-content}.full-notes{font-size:1.25rem;line-height:1.9;padding-top:1rem;overflow-wrap:break-word;max-width:65ch}.full-notes p{margin:0 0 1rem}.full-notes strong{font-weight:650}.full-notes .quote{padding:1rem 1.5rem;background:var(--tint);border-radius:12px}.full-notes .label{font-size:1rem;color:var(--muted);margin-top:1.5rem}.navigation{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:1rem max(1rem,env(safe-area-inset-right)) max(1rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left));pointer-events:none;z-index:10}.navigation button{pointer-events:auto;display:flex;align-items:center;justify-content:center;width:64px;height:64px;font-size:1.75rem;padding:0;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);box-shadow:0 4px 20px #0000000d}.status{font-size:.8125rem;color:var(--muted);line-height:1.7;padding:.5rem 0}.status:empty{display:none}dialog{border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);max-width:32rem;width:calc(100% - 2rem);padding:2rem}dialog::backdrop{background:#0006;backdrop-filter:blur(2px)}dialog h2{font-size:1.75rem;margin-bottom:1rem}dialog p{line-height:1.8;margin:1rem 0 1.5rem}.dialog-actions{display:flex;justify-content:flex-end;gap:.5rem}.confirm{background:var(--accent);color:var(--surface)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(prefers-color-scheme:dark){.confirm{color:#000}}
@media(min-width:90em){.navigation{padding-inline:max(1.5rem,calc((100vw - 86rem)/2))}}
@media(max-width:48em){.session-bar{padding-inline:1rem;gap:.5rem;min-height:60px}.total-timer{gap:.5rem}.total-value{font-size:1.25rem}.workspace{padding:.25rem 1rem 7rem}.paper{padding:1.5rem}.title-row{gap:1rem}.countdown{flex-basis:5.5rem;width:5.5rem;height:5.5rem}.remaining{font-size:1.125rem}.purpose{margin:1rem 0 1.5rem}.cue-list{row-gap:1rem}.cue-list li{grid-template-columns:2rem minmax(0,1fr);column-gap:.75rem}.cue-number{min-width:2rem;font-size:.9375rem}.full-notes{font-size:1.125rem}.navigation button{width:56px;height:56px}.section{margin-bottom:.5rem}}
@media(max-width:24em){.session-bar{justify-content:space-between;gap:.25rem}.total-timer{gap:.25rem}.total-label{font-size:.75rem}.total-goal{display:none}.reset,.play{padding-inline:.75rem}.play{min-width:4rem}.paper{padding:1rem}.title-row{gap:.75rem}.countdown{flex-basis:5rem;width:5rem;height:5rem}h1{font-size:1.5rem}}
@supports not(backdrop-filter:blur(1px)){.navigation button{background:var(--surface)}}@media(prefers-reduced-transparency:reduce){.navigation button{background:var(--surface);backdrop-filter:none;-webkit-backdrop-filter:none}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}@media(prefers-contrast:more){:root{--muted:var(--ink);--line:var(--ink)}}

<body>
<header class="session-bar" aria-label="全程計時">
 <div class="total-timer"><span class="total-label">總計時</span><span class="total-value" id="totalTime" role="timer" aria-label="全程已用時間">00:00</span><span class="total-goal">/ 20:00</span></div>
 <button id="resetAll" class="reset">重新排練</button>
 <button id="play" class="play" aria-pressed="false">開始</button>
</header>
<div class="workspace">
 <main class="paper" id="paper">
  <div class="title-row">
   <div class="heading"><p class="section" id="section"></p><h1 id="title"></h1></div>
   <div class="countdown" id="countdown">
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="ring-track" cx="50" cy="50" r="44"></circle><circle class="ring-fill" id="ringFill" cx="50" cy="50" r="44" pathLength="100"></circle></svg>
    <div class="ring-content"><span class="remaining" id="pageTime" role="timer" aria-label="本頁剩餘時間"></span><span class="ring-label" id="timerState">本頁剩餘</span></div>
   </div>
  </div>
  <p class="purpose" id="purpose"></p>
  <ul class="cue-list" id="cues"></ul>
  <div class="transition" id="transition"></div>
  <details class="full-details" id="fullDetails"><summary>完整講稿</summary><div class="full-notes" id="notes"></div></details>
 </main>
 <p id="saved" class="status" role="status"></p>
</div>
<nav class="navigation" aria-label="講稿翻頁"><button id="prev" aria-label="上一頁">←</button><button id="next" aria-label="下一頁">→</button></nav>
<dialog id="resetDialog"><h2>重新開始排練？</h2><p>清除全部頁面的計時，並回到第一頁。</p><div class="dialog-actions"><button id="cancelReset">取消</button><button id="confirmReset" class="confirm">重新開始</button></div></dialog>
<div id="announce" class="sr-only" aria-live="polite"></div>

<script>
'use strict';
const pages=[{"number":1,"title":"研究主題","seconds":25,"cues":["日常打字，能透露情緒線索嗎？","Zulueta 等人 · 2018 · JMIR","研究對象：雙相情緒障礙者"],"notes":["這頁在講什麼：介紹今天報告的研究，以及它想回答的問題。","必講提示：","•【研究主題】透過手機打字留下的行為資料，研究雙相情緒障礙的症狀程度。","•【文獻身分】Zulueta 等人在 2018 年發表於 Journal of Medical Internet Research，簡稱 JMIR。","•【核心問題】日常打字的方式，能不能提供情緒症狀的線索？","可用開場：","「大家每天都在打字，有時候回訊息很順，有時候打一行刪三次。今天這篇研究，就是想看看這些平常不太注意的打字行為，能不能提供情緒症狀的線索。」","接下一頁：先說明研究為什麼需要這些線索。"],"section":"背景與目的"},{"number":2,"title":"為什麼需要這項研究？","seconds":40,"cues":["症狀會隨時間改變","訪談像照片，評估之間有空白","手機行為，補上日常線索"],"notes":["這頁在講什麼：介紹傳統症狀評估在時間上的限制。","必講提示：","•【症狀會變動】雙相情緒障礙者的憂鬱與躁症症狀，可能隨時間改變。","•【評估有間隔】訪談與量表讓我們了解某個時間點的狀況，但兩次評估之間的變化，可能沒有被完整記錄。","•【手機提供補充】手機經常出現在日常生活中，因此研究者希望從使用行為中，找到額外資訊。","白話比喻：","「可以把一次訪談想成拍一張照片，這張照片很有用，但兩次拍照中間發生什麼，還需要其他資料幫忙補上。」","接下一頁：這種利用日常數位資料研究健康的方法，就是接下來的 Digital Phenotyping。"],"section":"背景與目的"},{"number":3,"title":"什麼是數位表型？","seconds":40,"cues":["數位表型：用數位足跡研究健康","日常打字 → 節奏、修改、動作","怎麼打字，與症狀有沒有關聯？"],"notes":["這頁在講什麼：先解釋 Digital Phenotyping，再介紹這項研究怎麼做。","必講提示：","•【數位表型】利用人與數位裝置互動時留下的資料，研究行為與健康狀況。","•【手機使用】起點是日常打字，不需要另外完成一套打字測驗。","•【行為資料】例如按鍵間隔、修改行為，以及手機動作。","•【連結症狀】再檢查這些資料是否與憂鬱、躁症症狀有關。","可用說法：","「這篇研究關心的是你打字的節奏、停頓和修改方式，不會拿你的聊天內容來分析你今天在想什麼。」","接下一頁：接著說明，為什麼研究者特別選擇打字。"],"section":"背景與目的"},{"number":4,"title":"為什麼研究打字行為？","seconds":35,"cues":["打字本來就會發生","需要動作、注意力與錯誤修正","被動記錄，減少額外任務"],"notes":["這頁在講什麼：逐一說明打字適合成為研究資料的三個理由。","必講提示：","•【日常就會發生】傳訊息、搜尋資料、寫信，都可能用到鍵盤。","•【涉及多種能力】打字需要手指動作、注意力，也需要發現錯誤並修正。","•【可以被動收集】使用者照常打字，系統就能記錄相關資料，減少額外任務。","可用生活例子：","「我們覺得回一句『好喔』很簡單，但背後其實要看畫面、選字、按對位置，還要確認沒有送出奇怪的字。」","接下一頁：有了這個想法，研究具體要回答什麼？"],"section":"背景與目的"},{"number":5,"title":"研究目的與症狀量表","seconds":35,"cues":["打字行為能解釋症狀程度嗎？","HDRS-17：憂鬱症狀","YMRS：躁症症狀","各自分數越高，症狀越嚴重"],"notes":["這頁在講什麼：介紹研究問題，以及用什麼評估症狀。","必講提示：","•【研究問題】手機打字行為，能否幫助解釋雙相情緒障礙者的症狀嚴重程度？","•【HDRS-17】17 題的漢密爾頓憂鬱量表，用來評估憂鬱症狀。","•【YMRS】楊氏躁症量表，用來評估躁症症狀。","•【分數的意思】在各自量表中，分數越高，代表對應症狀越嚴重；兩種量表分數不能直接互相比大小。","接下一頁：研究者預期，哪些行為可能跟症狀一起改變？"],"section":"背景與目的"},{"number":6,"title":"研究者預期看到的行為訊號","seconds":35,"cues":["動作：速度與手機加速度","注意力：停頓與修正","社交：打字頻率只是線索","作息：一天何時打字","這些是假設，還不是結果"],"notes":["這頁在講什麼：這頁介紹研究假設，還不是研究結果。","必講提示：","•【動作】打字速度或手機動作，可能反映精神動作方面的變化。","•【注意力與修正】停頓、退格、自動更正，可能提供注意力或錯誤處理的線索。","•【社交活動】打字頻率可能與社交活動有關，但打字也可能是在搜尋，不能直接畫上等號。","•【日常作息】打字集中在哪些時段，可能反映日常活動模式的改變。","接下一頁：","「這些都是合理的猜想，但猜想要變成研究結果，還是得實際追蹤。」","【累計目標：3 分 30 秒】"],"section":"背景與目的"},{"number":7,"title":"八週研究流程","seconds":45,"cues":["追蹤 8 週，使用研究手機","日常：BiAffect 被動收集","每週：電話評估兩種量表","評分配對前一週的打字資料"],"notes":["這頁在講什麼：介紹追蹤期間與兩種資料如何配對。","必講提示：","•【八週追蹤】參與者使用研究提供、裝有 BiAffect 鍵盤的手機。","•【日常收集】在平常打字時，被動留下行為資料。","•【每週評估】研究人員透過電話訪談，評估 HDRS-17 與 YMRS。","•【資料配對】每次症狀評分，搭配評估前一週的打字資料。","指圖提示：沿著 W1 到 W8 帶一次即可，再指出「持續收集」與「每週評估」的差別。","可用說法：","「像是一邊累積這一週的打字紀錄，一邊在每週固定做一次症狀評估，再把兩邊放在一起看。」","接下一頁：接著看有多少人參與，最後又有多少人進入分析。"],"section":"研究方法"},{"number":8,"title":"參與者如何篩選？","seconds":30,"cues":["19 人開始參與","1 人未啟用、2 人提早刪除 → 16 人","7 人不足四週資料 → 最後 9 人"],"notes":["這頁在講什麼：依流程圖，清楚說明 19 人如何變成 9 人。","必講提示：","•【最初 19 人】","•【剩下 16 人】1 人沒有啟用 App，2 人很早就刪除。","•【最後 9 人】另有 7 人的鍵盤資料不足四週，因此未納入最終分析。","•【提醒】報名人數與最後分析人數不同。","接下一頁：","「所以，接下來看到的主研究結果，主要來自這九位參與者。我們再看看他們的特徵。」"],"section":"研究方法"},{"number":9,"title":"最後九位參與者的特徵","seconds":30,"cues":["平均約 49 歲；SD 表示分散程度","8 位女性；5 位一型、4 位二型","8 位快速循環：一年至少四次發作","樣本小，而且族群集中"],"notes":["這頁在講什麼：介紹樣本組成，讓聽眾知道結果來自哪些人。","必講提示：","•【年齡】平均約 49 歲；SD 是標準差，表示年齡分散的程度。","•【性別】9 人中有 8 位女性。","•【診斷類型】5 位雙相一型、4 位雙相二型。","•【快速循環】8 人符合快速循環，一年內有至少四次情緒發作；不是一天之內心情變四次。","收住這頁：樣本小，而且組成偏向特定族群，之後解讀結果要記得這件事。","接下一頁：介紹實際使用的研究工具。"],"section":"研究方法"},{"number":10,"title":"BiAffect 鍵盤","seconds":25,"cues":["Samsung Galaxy Note 4","BiAffect 取代預設鍵盤","外觀接近一般 Android 鍵盤","作為主要手機，照常使用"],"notes":["這頁在講什麼：先指出圖片是研究使用的鍵盤。","必講提示：","•【研究手機】Samsung Galaxy Note 4。","•【自訂鍵盤】BiAffect 取代原本的 Android 預設鍵盤。","•【使用方式】研究要求參與者把這支手機當作主要手機使用。","•【外觀設計】刻意接近一般鍵盤，讓日常使用比較自然。","可用說法：","「從畫面上看，它其實很像一般鍵盤，研究功能主要藏在背後的資料記錄。」","接下一頁：那它究竟記錄什麼？"],"section":"研究方法"},{"number":11,"title":"資料收集與隱私","seconds":35,"cues":["有收：時間、退格／空白鍵事件、加速度","沒收：一般文字與完整訊息內容","安全、加密傳輸","有保護措施 ≠ 完全沒有隱私風險"],"notes":["這頁在講什麼：先分別介紹「有收」與「沒有收」的資料，再交代傳輸方式。","必講提示：","•【有收】按鍵日期與時間、退格鍵與空白鍵事件、加速度計讀值。","•【沒有收】一般字母與字元內容，以及完整訊息內容。","•【傳輸方式】資料使用安全、加密的方式上傳。","可用說法：","「聽到鍵盤會記錄資料，大家可能先想到：那我的聊天內容呢？這個研究記錄的是打字行為，沒有收集整段訊息寫了什麼。」","講者提醒：說明具體保護措施即可，不延伸成「完全沒有隱私風險」。","接下一頁：研究者把這些紀錄整理成七項指標。"],"section":"研究方法"},{"number":12,"title":"七項行為指標","seconds":80,"cues":["按鍵間隔：兩次按鍵隔多久","退格比例：刪除與修改","自動更正率：系統更正頻率","段落長度：持續幾秒，不是字數","段落數：停至少 5 秒劃分","加速度：手機訊號，不等於手抖","每日模式：與自己的整體作息多像"],"notes":["這頁在講什麼：這頁是整份研究的核心，七項指標要分別介紹。","①【平均按鍵間隔 Average interkey delay】","前後兩次按鍵隔多久。間隔越長，代表按鍵之間平均等得越久。","②【退格比例 Backspace rate】","全部按鍵中，有多少比例是退格。可以聯想到刪除、修改，但不一定每次都是打錯字。","③【自動更正率 Autocorrect rate】","自動更正事件相對於全部按鍵的比例，反映系統介入更正的頻率。","④【平均打字段落長度 Average session length】","一段打字活動平均持續幾秒。這裡的「長度」指時間，不是字數。","⑤【打字段落數 Session count】","一週出現幾段打字活動。主研究以停止按鍵至少五秒作為段落分界，不等於幾則訊息或幾次聊天。","⑥【平均加速度指標 Average accelerometer displacement】","根據手機加速度計訊號計算。不能當成手機移動幾公分，也不能直接稱為手抖程度。","⑦【每日模式相似度 Circadian baseline similarity】","比較這一週各時段的打字分布，和同一個人在整段研究期間的模式有多相像。","可用收束：","「所以研究不只問打得快不快，也看怎麼修改、一次打多久、一天什麼時間在打。」","接下一頁：七項指標整理好之後，如何形成一筆分析資料？"],"section":"研究方法"},{"number":13,"title":"一筆「人週」資料是什麼？","seconds":30,"cues":["一筆觀察＝一個人、某一週","七項行為特徵＋兩種量表分數","同一人可以貢獻多週","資料筆數，不等於人數"],"notes":["這頁在講什麼：介紹分析資料的基本單位。","必講提示：","•【一人一週】一位參與者某一週的資料，就是一筆 participant-week observation。","•【行為部分】那一週整理出的七項指標。","•【症狀部分】對應的 HDRS-17 與 YMRS 評分。","•【重複觀察】同一人可以貢獻好幾週，因此很多筆資料不等於很多位不同的人。","可用說法：","「例如同一位參與者第一週是一筆、第二週又是一筆，但這兩筆背後仍然是同一個人。」","接下一頁：這也是接下來選擇統計方法時要考慮的事。"],"section":"研究方法"},{"number":14,"title":"為什麼使用兩種統計模型？","seconds":60,"cues":["七項特徵一起分析","憂鬱：混合模型，納入個人基準","躁症：個人截距變異估為 0，改用 OLS","ln(YMRS＋1)：處理分布偏斜","係數不能當作原始躁症分數"],"notes":["這頁在講什麼：先解釋模型在做什麼，再分別介紹左右兩邊。","必講提示：","•【共同做法】把七項行為指標一起放進模型，分析它們與症狀分數的關係。","•【憂鬱模型：Linear mixed-effects model】中文是線性混合效應模型。除了行為指標，也允許每位參與者有自己的症狀基準，這就是 participant-specific random intercept。","•【白話理解】每個人的起點可能不同，模型把這個差異納入考慮。","•【躁症模型：Multiple linear regression，OLS】研究原本也考慮個人基準差異，但估計出的這部分變異為零，因此最後採用一般多元線性迴歸。","•【ln(YMRS＋1)】躁症分數先加一再取自然對數，是為了處理分布偏斜。因此後面係數不是原始躁症量表的分數變化。","講者提醒：不用推導公式；重點是讓同學理解「一起看七項指標」與「是否納入個人基準」。","接下一頁：看這些模型實際用了多少資料。"],"section":"研究方法"},{"number":15,"title":"研究資料總量","seconds":25,"cues":["9 位參與者","64 筆人週觀察","約 63 萬次按鍵","約 666 萬筆加速度資料","記錄很密集，但仍只有九個人"],"notes":["這頁在講什麼：逐一介紹四個數字代表什麼。","必講提示：","•【9 位參與者】","•【64 筆人週觀察】","•【626,641 次按鍵】約 63 萬次。","•【6,660,890 筆加速度資料】約 666 萬筆。","可用收束：","「資料筆數看起來很壯觀，但背後仍然只有九個人。記錄得很密集，和樣本很多，是兩件需要分開看的事。」","接下一頁：接著進入憂鬱症狀的分析結果。","【累計目標：9 分 30 秒】"],"section":"研究方法"},{"number":16,"title":"憂鬱症狀：整體模型結果","seconds":65,"cues":["41%：七項行為特徵的解釋量","63%：再加上個人基準差異","加入特徵後，模型更符合資料","p＝.014：達常用顯著標準","63% 絕不是診斷準確率"],"notes":["這頁在講什麼：這頁先看整個模型的表現，下一頁才看個別指標。","必講提示：","•【Marginal R²＝.41】七項行為特徵解釋約 41% 的症狀分數變異。","•【Conditional R²＝.63】連同個人基準差異，模型解釋約 63% 的變異。","•【變異是什麼】這些觀察中的分數有高有低，R² 描述模型能解釋多少這種高低差異。","•【模型比較】加入七項行為特徵後，比只考慮個人基準的模型更符合資料。投影片列出 χ²＝17.6、p＝.014。","•【p 值入門】假設加入這些特徵其實沒有改善，在統計假設成立下，出現目前這麼大或更大改善的機率約為 1.4%；依常用 .05 標準，屬於統計顯著。","•【避免誤讀】63% 不是診斷準確率，也不是每個人都能預測對六成。","接下一頁：","「整體看起來有關係，那七項指標裡，究竟哪些比較明確？」"],"section":"研究結果"},{"number":17,"title":"憂鬱症狀：四項顯著關聯","seconds":65,"cues":["加速度較高：＋3.20","按鍵間隔較長：＋2.88","自動更正較多：＋2.67","打字段落較多：＋2.18","同時考慮其他特徵；四項 p＜.05","係數已縮放，不是多按一次的效果"],"notes":["這頁在講什麼：四項指標在同時考慮其他特徵後，都與較高的憂鬱分數相關。","必講提示：","•【加速度指標：＋3.20】指標較高，憂鬱分數也較高。","•【平均按鍵間隔：＋2.88】按鍵之間等得較久，與較高分數相關。","•【自動更正率：＋2.67】自動更正比例較高，與較高分數相關。","•【打字段落數：＋2.18】打字活動分成較多段，也與較高分數相關。","數字怎麼看：","• 正號表示關聯方向是往上。","• 這些係數使用經過尺度處理的指標，不能解釋成「多按一次鍵就增加幾分」。","• 四項 p 值都低於 .05；不必逐一念完小數，讓聽眾知道判斷依據即可。","可用停頓：","「其中『打字段落越多，憂鬱分數越高』可能和直覺不太一樣，等一下會再回來談。」","接下一頁：先看看躁症的結果是否相同。"],"section":"研究結果"},{"number":18,"title":"躁症症狀：模型與個別結果","seconds":60,"cues":["R²＝.34；調整後＝.26","整體 p＝.0011","加速度：正向，＋.39","退格比例：負向，−.30","結果對應 ln(YMRS＋1)","多按退格，不能因此改善症狀"],"notes":["這頁在講什麼：先講整體解釋量，再講兩項顯著指標。","必講提示：","•【Multiple R²＝.34】模型解釋約 34% 的對數轉換後躁症分數變異。","•【Adjusted R²＝.26】調整後約 26%；這個數字會考量模型使用的變項數量，避免只因放入更多變項就高估表現。","•【整體檢定】F 約 4.1、p＝.0011，依常用標準達到統計顯著。","•【加速度指標：正向關聯】係數＋.39，p＝.003。","•【退格比例：負向關聯】係數－.30，p＝.014；比例較高，對應的躁症分數傾向較低。","講者提醒：係數對應 ln(YMRS＋1)，不能說退格比例增加就讓原始躁症分數減少 0.30 分，更不能說多按退格可以改善症狀。","接下一頁：把結果放在一起，會發現幾個值得討論的地方。"],"section":"研究結果"},{"number":19,"title":"出乎預期與不顯著的結果","seconds":40,"cues":["段落越多，憂鬱分數越高：出乎預期","加速度與憂鬱、躁症都相關","每日模式相似度：未達顯著","不顯著，不等於證明沒有關聯"],"notes":["這頁在講什麼：逐項介紹三個不能只靠直覺解讀的發現。","必講提示：","•【段落數更多，憂鬱分數更高】和原先預期不同。研究沒有記錄打字情境，因此不能據此確定原因。","•【加速度同時與兩類症狀相關】它不是只對應躁症的專屬訊號。","•【每日模式相似度不顯著】這次資料沒有提供足夠證據支持關聯，不等於已經證明完全沒有關係。","可用說法：","「研究有趣的地方，就是結果不一定照我們原本猜的走。這時候要回頭檢查資料，而不是幫結果硬編一個故事。」","接下一頁：用下一頁把幾個統計詞整理清楚。"],"section":"研究結果"},{"number":20,"title":"如何正確解讀結果？","seconds":40,"cues":["相關：兩者是否一起變動？","迴歸係數：考慮其他特徵後的關聯","R²：模型解釋多少差異？","相關 ≠ 因果；解釋量 ≠ 準確率"],"notes":["這頁在講什麼：這頁是結果的閱讀指南，分清楚三種問題。","必講提示：","•【Correlation，相關】兩個變項是否傾向一起變動？","•【Regression coefficient，迴歸係數】在同時考慮模型內其他特徵後，某項特徵和症狀分數如何相關？","•【R²，解釋量】模型能解釋多少分數的差異？","•【因果限制】兩者有關，還不能判定是誰造成誰。","•【準確率限制】解釋量不能直接換成辨識患者的成功率。","可用比喻：","「就像雨天和雨傘常一起出現，但不能因此說，是雨傘讓天空下雨。」","接下一頁：理解這些界線後，再來看研究真正的貢獻。","【累計目標：14 分】"],"section":"研究結果"},{"number":21,"title":"研究貢獻","seconds":40,"cues":["概念驗證 · Proof of concept","可行：日常被動收集資料","證據：部分特徵與症狀相關","值得繼續研究，尚非臨床工具"],"notes":["這頁在講什麼：這項研究主要提供概念驗證，也就是 proof of concept。","必講提示：","•【可行性】日常使用手機時，確實可以被動收集可分析的行為資料。","•【初步證據】部分特徵與研究人員評估的憂鬱、躁症症狀分數有關。","•【研究意義】平常的打字方式，可能包含值得研究的症狀線索。","•【目前階段】它還不是經過充分驗證、可以直接拿來臨床判斷的工具。","可用說法：","「這篇研究先讓我們看到，這條路值得繼續研究；至於能不能在臨床可靠使用，還有下一段路要走。」","接下一頁：哪些限制讓我們需要保持這個距離？"],"section":"貢獻與限制"},{"number":22,"title":"研究限制","seconds":50,"cues":["只有 9 人，且族群集中","排除資料不足者：可能選擇偏差","研究手機可能改變原本習慣","尚未獨立驗證新的人或未來資料"],"notes":["這頁在講什麼：四項限制分開講，並各自說明影響。","必講提示：","•【樣本小且集中】只有 9 人，多數是女性與快速循環者，不容易代表所有雙相情緒障礙者。","•【資料不完整】資料不足的人被排除，留下的人可能在使用習慣或其他特徵上有所不同，造成選擇偏差。","•【研究提供手機】換了一支手機或鍵盤，可能影響原本的打字習慣。","•【預測驗證有限】在這批資料中表現如何，與換一批新的人、或預測未來資料時是否仍有效，需要分開確認。","可用比喻：","「有點像練習題做得不錯，我們還要看換一份題目，表現能不能維持。」","接下一頁：因此主研究的結論要怎麼說才恰當？"],"section":"貢獻與限制"},{"number":23,"title":"主研究整體結論","seconds":30,"cues":["有潛力：打字可能提供症狀線索","仍需要：更大研究與獨立驗證","接下來，看四篇後續研究"],"notes":["這頁在講什麼：用兩點收束 2018 年主研究。","必講提示：","•【有潛力】被動收集的打字資料，可能成為情緒症狀嚴重程度的指標。","•【仍需驗證】需要更大、更多元的研究，以及獨立驗證，才能評估臨床用途。","可用轉場：","「到這裡，2018 年這篇研究先提出了可能性。接下來四頁，我們看看後續研究如何從不同角度繼續追這個問題。」","【累計目標：16 分】"],"section":"貢獻與限制"},{"number":24,"title":"2020 年：更大的日常使用樣本","seconds":45,"cues":["250 位使用者，其中 147 位填問卷","超過 1,400 萬次按鍵","憂鬱較重：速度更不穩定","段落較短、準確度較低","自填 PHQ-8，與主研究評估不同"],"notes":["這頁在講什麼：介紹 Vesel 等人如何把研究帶到更大的真實生活樣本。","必講提示：","•【250 人】提供人口學資料的使用者。","•【其中 147 人】另外完成憂鬱問卷；是前面 250 人的一部分。","•【超過 1,400 萬次按鍵】提供大量日常打字紀錄。","•【三項結果逐一介紹】較嚴重的憂鬱症狀，與打字速度更不穩定、打字段落較短、準確度較低相關。","•【與主研究的差別】這裡使用自填憂鬱問卷 PHQ-8，不能把樣本與評估方式視為完全相同。","可用解釋：","「速度更不穩定，指的是快慢變化較大；不能直接簡化成每個人都打得比較慢。」","接下一頁：下一篇進一步研究，能不能預測之後的症狀變化。"],"section":"後續研究"},{"number":25,"title":"2022 年：預測症狀變化","seconds":50,"cues":["291 位使用者，平均約 3 個月","前一週打字＋加速度資料","預測 PHQ 變化至少 4 分","包含上升或下降，不只惡化","五折交叉驗證：輪流訓練與評估","加速度提供資訊，仍非臨床驗證"],"notes":["這頁在講什麼：介紹 Bennett 等人把研究問題轉向分數是否會發生變化。","必講提示：","•【291 位 App 使用者】平均收集約三個月資料；不能把所有人都稱為確診雙相患者。","•【前一週資料】使用打字與手機加速度等特徵。","•【預測目標】PHQ 分數是否出現至少 4 分的變化，包括增加或減少。","•【機器學習】讓模型從資料中學習與目標有關的模式。","•【五折交叉驗證】將資料分為五份，輪流使用其中一份評估，其餘用於訓練。","•【重點發現】加速度資料能提供有用的預測資訊。","講者提醒：交叉驗證是評估方法，不能直接說成已完成臨床驗證。","接下一頁：另一個方向，是把單一打字行為分析得更細。"],"section":"後續研究"},{"number":26,"title":"2024 年：退格模式與情緒症狀","seconds":50,"cues":["128 位成人，2,948 筆觀察","統計模型分成低、中、高退格率群","低群：比較基準","中群：憂鬱分數較高","高群：躁症分數較高","與 2018 樣本、方法不同，不能硬拼"],"notes":["這頁在講什麼：介紹 Liu 等人如何用退格比例找出不同群組。","必講提示：","•【研究資料】128 位成人、2,948 筆觀察。","•【分群方法】Bayesian mixture model，可先白話說成「用統計模型找出資料裡不同的群組」。","•【低退格率群】作為比較基準。","•【中退格率群】相較低群，憂鬱症狀分數較高。","•【高退格率群】相較低群，躁症症狀分數較高。","主動處理疑問：","「大家可能記得，前面 2018 年看到退格比例和躁症是負向關聯。這裡換了樣本，也改用群組比較，所以不能把兩篇直接拼成同一條規則。」","收住這頁：退格模式值得進一步研究，但不能用某個人的退格次數直接判斷他的情緒狀態。","接下一頁：最後一篇把焦點延伸到認知功能。"],"section":"後續研究"},{"number":27,"title":"2025 年：打字模式與認知功能","seconds":45,"cues":["18 位雙相者＋12 位健康比較者","Entropy：節奏的不規律程度","倫敦塔：依規則移球，研究規劃","打字與移動時間的不規律相關","r＝.59，p＝.006","探索性關聯，尚非認知評估工具"],"notes":["這頁在講什麼：介紹 Ajilore 等人比較日常打字與規劃任務的表現。","必講提示：","•【招募對象】18 位雙相情緒障礙者、12 位健康比較者。","•【打字不規律程度】觀察按鍵間隔的 entropy，熵；這裡可理解為節奏有多不規律。","•【倫敦塔任務 Tower of London】依規則移動球，達成指定排列，用來研究規劃與解題。","•【任務不規律程度】觀察每一步移動所需時間的變化。","•【結果：r＝.59，p＝.006】打字時間較不規律，與任務移動時間較不規律相關。","•【界線】這是探索性關聯，不能直接說打字亂就代表認知功能不好。","接下一頁：這些研究共同指向哪些下一步？"],"section":"後續研究"},{"number":28,"title":"未來研究方向","seconds":20,"cues":["更大、更多元的樣本","驗證新參與者與未來資料","自己的手機，長期真實生活追蹤"],"notes":["這頁在講什麼：把後續需要完成的工作分成三項。","必講提示：","•【更多元的樣本】確認結果能否適用於不同族群。","•【獨立驗證】放到新參與者與未來資料中測試。","•【真實生活長期追蹤】評估使用自己的手機時，能否穩定運作並提供臨床價值。","接下一頁：最後回到今天希望大家帶走的重點。","【累計目標：19 分 30 秒】"],"section":"後續研究"},{"number":29,"title":"帶走的重點與參考文獻","seconds":20,"cues":["五篇文獻，是今天的依據","日常打字，可能藏著健康線索","研究要確認：這些線索多可靠？","臨床用途仍需驗證"],"notes":["這頁在講什麼：先指出下方列出今天使用的五篇文獻，再用一句話回收整場報告。","必講提示：","•【日常打字有研究價值】可能提供情緒症狀的線索。","•【臨床用途仍需驗證】不能僅靠打字行為下診斷。","可用收尾：","「今天如果只記得一句話，就是：我們每天怎麼打字，可能藏著健康線索；而研究的任務，就是確認這些線索有多可靠。」"],"section":"結語"},{"number":30,"title":"致謝","seconds":10,"cues":["以上是第五組的報告","謝謝老師與同學的聆聽","歡迎提問"],"notes":["「以上是第五組的報告，謝謝老師和同學的聆聽，接下來歡迎提問。」","【累計目標：20 分鐘。問答由此開始另計。】"],"section":"結語"}];
const $=id=>document.getElementById(id);
const key='biaffect-prompter-v1';
let stored={};try{stored=JSON.parse(localStorage.getItem(key)||'{}')||{}}catch{}
let index=Number.isInteger(stored.index)?Math.min(29,Math.max(0,stored.index)):0;
const hashPage=Number(location.hash.slice(1));
if(Number.isInteger(hashPage)&&hashPage>=1&&hashPage<=30)index=hashPage-1;
let elapsed=Array.isArray(stored.elapsed)&&stored.elapsed.length===30?stored.elapsed.map(v=>Number.isFinite(v)&&v>=0?v:0):Array(30).fill(0);
let running=false,last=Date.now(),lastSave=0;
function format(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function countdownValue(budget,used){return used<=budget?Math.ceil(budget-used)+'秒':'-'+Math.ceil(used-budget)+'秒'}
function ringOffset(budget,used){return Math.min(100,Math.max(0,used/budget*100))}
function account(){const now=Date.now();if(running)elapsed[index]+=Math.max(0,now-last)/1000;last=now}
function save(){try{localStorage.setItem(key,JSON.stringify({index,elapsed}));}catch{$('saved').textContent='瀏覽器無法儲存進度，請保持本頁開啟。'}}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rich(s){return esc(s).replace(/【([^】]+)】/g,'<strong>$1</strong>')}
function updateTimers(){
 const used=elapsed[index],budget=pages[index].seconds,over=used>budget;
 $('pageTime').textContent=countdownValue(budget,used);
 $('pageTime').setAttribute('aria-label',over?'本頁超時 '+Math.ceil(used-budget)+' 秒':'本頁剩餘 '+Math.ceil(budget-used)+' 秒');
 $('totalTime').textContent=format(elapsed.reduce((a,b)=>a+b,0));
 $('countdown').classList.toggle('over',over);
 $('timerState').textContent=over?'已超時':running?'本頁剩餘':used>0?'已暫停':'本頁剩餘';
 $('play').textContent=running?'暫停':elapsed.some(v=>v>0)?'繼續':'開始';
 $('play').setAttribute('aria-pressed',String(running));
 $('play').setAttribute('aria-label',running?'暫停計時':'開始或繼續計時');
 $('ringFill').style.strokeDashoffset=String(ringOffset(budget,used));
}
function render(){
 const p=pages[index];
 $('section').textContent=p.section;
 $('title').textContent=p.title;
 $('purpose').textContent=(p.notes.find(l=>l.startsWith('這頁在講什麼：'))||'謝謝聆聽，接著進入問答。').replace('這頁在講什麼：','');
 $('cues').innerHTML=p.cues.map((c,i)=>'<li><span class="cue-number" aria-hidden="true">'+String(i+1).padStart(2,'0')+'</span><span class="cue-text">'+esc(c)+'</span></li>').join('');
 $('notes').innerHTML=p.notes.filter(l=>!l.startsWith('這頁在講什麼：')).map(l=>'<p class="'+(l.startsWith('「')?'quote':/：$/.test(l)?'label':'')+'">'+rich(l)+'</p>').join('');
 const ti=p.notes.findIndex(l=>l.startsWith('接下一頁：'));
 const transition=ti<0?'報告完成，接著進入問答。':p.notes[ti].replace('接下一頁：','')||(p.notes[ti+1]||'');
 $('transition').innerHTML='<span class="caption">銜接提示</span>'+esc(transition);
 $('prev').disabled=index===0;$('next').disabled=index===29;
 updateTimers();
}
function go(n){if(n<0||n>=30||n===index)return;account();index=n;history.replaceState(null,'','#'+(index+1));$('fullDetails').open=false;render();save();window.scrollTo({top:0,behavior:'instant'});$('announce').textContent='第 '+(index+1)+' 頁，'+pages[index].title}
function toggle(){account();running=!running;updateTimers();save();$('announce').textContent=running?'計時已開始':'計時已暫停'}
$('prev').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);$('play').onclick=toggle;
$('resetAll').onclick=()=>$('resetDialog').showModal();$('cancelReset').onclick=()=>$('resetDialog').close();
$('confirmReset').onclick=()=>{account();running=false;elapsed.fill(0);index=0;history.replaceState(null,'','#1');$('fullDetails').open=false;render();save();$('resetDialog').close();window.scrollTo(0,0)};
document.addEventListener('keydown',e=>{
 if(e.altKey||e.ctrlKey||e.metaKey||document.querySelector('dialog[open]')||e.target.closest('input,select,textarea,a,[contenteditable=true]'))return;
 if(e.key==='ArrowRight'){e.preventDefault();go(index+1)}
 if(e.key==='ArrowLeft'){e.preventDefault();go(index-1)}
 if(e.code==='Space'&&!e.target.closest('button,summary')){e.preventDefault();if(!e.repeat)toggle()}
});
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>=1&&n<=30)go(n-1)});
document.addEventListener('visibilitychange',()=>{account();save();updateTimers()});window.addEventListener('pagehide',()=>{account();save()});
setInterval(()=>{account();updateTimers();if(Date.now()-lastSave>2000){save();lastSave=Date.now()}},200);
render();
</script>
</body></html>
